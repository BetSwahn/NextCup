<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NextCup</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NextCup">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e17">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14171c;--mu:#667085;--ac:#1a56db;--bd:#e2e5ea;--live:#12805c;--chip:#e9ecf1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--tx:#eceef2;--mu:#9aa3b2;--ac:#7aa5ff;--bd:#272c35;--live:#3ecf9b;--chip:#222833;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--tx:#eceef2;--mu:#9aa3b2;--ac:#7aa5ff;--bd:#272c35;--live:#3ecf9b;--chip:#222833;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.6rem;margin:6px 0 2px}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 14px}
input[type=search]{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 13px;background:var(--chip);color:var(--tx);font-size:.88rem;cursor:pointer}
.chip.on{background:var(--ac);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#0b1220}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0b1220;color:#fff}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 16px}
.logo{flex:1;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.logo b{color:#f2b632;font-weight:800}
.ib{background:none;border:0;color:#fff;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:12px}
.ib:active{background:#ffffff26}
#sb{display:none;padding:0 14px 12px}
body.srch #sb{display:block}
#sb input{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;border:0;background:#fff;color:#14171c;font-size:1rem}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
body.menu #ov{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(330px,86vw);box-sizing:border-box;background:var(--card);color:var(--tx);transform:translateX(100%);transition:transform .25s;z-index:50;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 10px calc(env(safe-area-inset-bottom,0px) + 24px)}
body.menu #drawer{transform:none}
.dh{font-weight:700;font-size:1.1rem;padding:6px 14px 10px}
.chips{display:block;overflow:visible;padding:0}
.chip{display:flex;width:100%;justify-content:space-between;align-items:center;border-radius:12px;padding:13px 14px;background:none;font-size:1rem;text-align:left}
.chip .n{color:var(--mu);font-size:.85rem}
.chip.on .n{color:#fff}
body::before,header{background:#0b0e17}
header{border-bottom:1px solid #262a3a}
.hd{gap:10px;padding:12px 14px}
.logo{display:flex;align-items:center;gap:12px;font-size:1.75rem;font-style:italic;font-weight:900;letter-spacing:-.04em;line-height:1}
.logo b{color:#f2b632;font-weight:900}
.lg{height:46px;width:auto;flex:none;display:block}
.ib{width:46px;height:46px;border-radius:14px;background:#161a28;border:1px solid #2a3045;color:#e6e9f2}
#sb input{background:#161a28;color:#e6e9f2;border:1px solid #2a3045}
.card{cursor:pointer}
.tvi{width:20px;height:20px;border-radius:6px;vertical-align:-5px;margin-right:6px}
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;align-items:flex-end;justify-content:center}
body.mo #mo{display:flex}
#sh{position:relative;background:var(--card);color:var(--tx);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:85vh;overflow-y:auto;box-sizing:border-box}
#sh .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border:0;border-radius:12px;background:var(--chip);color:var(--tx);font-size:1rem;cursor:pointer}
.mh{font-size:2rem}
#sh h3{margin:4px 44px 2px 0;font-size:1.35rem}
.ms{color:var(--mu);font-size:.9rem;margin-bottom:10px}
.desc{margin:6px 0 10px;line-height:1.5}
.r{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--bd)}
.r span{color:var(--mu)}
.r b{text-align:right;font-weight:600}
#sh .tvi{width:26px;height:26px;vertical-align:-8px}
.go{display:block;margin-top:16px;text-align:center;padding:13px;border-radius:12px;background:var(--ac);color:#fff;text-decoration:none;font-weight:600}
.opt{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.85rem;margin:6px 2px 0}
.opt label{cursor:pointer}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 2px 8px}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.card.live{border-color:var(--live)}
.card.done{opacity:.55}
.em{font-size:1.7rem;flex:none;width:2.2rem;text-align:center}
.bd{flex:1;min-width:0}
.nm{font-weight:600}
.mt{color:var(--mu);font-size:.85rem}
.tv{font-size:.8rem;color:var(--ac);margin-top:2px}
.st{flex:none;text-align:right;font-size:.8rem;font-weight:600;color:var(--ac);max-width:6.5rem}
.live .st{color:var(--live)}
.done .st{color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:40px 0}
footer{color:var(--mu);font-size:.78rem;text-align:center;margin-top:26px}
</style></head><body>

let cur=[];
function show(i){
  const x=cur[i];if(!x)return;
  const t=status(x)[1],n=Math.round((x.e-x.s)/864e5)+1,ds=d=>d.toLocaleDateString("sv-SE",{weekday:"short",day:"numeric",month:"long",year:"numeric"});
  let w;
  if(x.ap===2)w=x.l+" (ej klart)";
  else if(x.l)w=x.l;
  else if(x.k==="mot")w="Kval "+ds(x.s)+"<br>Lopp "+ds(x.e);
  else w=(+x.s===+x.e?ds(x.s):ds(x.s)+" – "+ds(x.e))+(x.ap?" (ca)":"");
  const row=(a,b)=>'<div class="r"><span>'+a+'</span><b>'+b+'</b></div>';
  let h='<button class="x" aria-label="Stäng">✕</button><div class="mh">'+S[x.k][0]+'</div><h3>'+x.n+'</h3><div class="ms">'+S[x.k][1]+'</div>';
  if(x.d)h+='<p class="desc">'+x.d+'</p>';
  h+=row("Datum",w)+row("Plats",x.p)+row("Status",t);
  if(n>1&&x.k!=="mot"&&x.ap!==2&&!x.l)h+=row("Längd",n+" dagar");
  h+=row("TV i Sverige",x.tv?TVI+x.tv:"Ej bekräftad");
  h+='<a class="go" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent(x.n+" "+x.s.getFullYear())+'">Sök mer om tävlingen ↗</a>';
  document.getElementById("sh").innerHTML=h;document.body.classList.add("mo");
}
function status(x){
  if(x.e<T)return["done","Avslutat"];
  if(x.ap===2)return["","Datum ej klart"];
  if(x.s<=T)return["live","Pågår nu"];
  const d=Math.round((x.s-T)/864e5);
  return["",d===1?"Imorgon":d<=60?"om "+d+" dagar":d<=150?"om "+Math.round(d/7)+" veckor":"om "+Math.round(d/30.4)+" mån"];
}
function dtxt(x){
  if(x.l)return x.l;
  if(x.k==="mot"){const w=d=>d.toLocaleDateString("sv-SE",{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"");return "Kval "+w(x.s)+" · Lopp "+w(x.e)}
  const t=+x.s===+x.e?f(x.s):f(x.s)+" – "+f(x.e);
  const y=x.s.getFullYear()!==T.getFullYear()||x.e.getFullYear()!==x.s.getFullYear()?" "+(x.e.getFullYear()):"";
  return (x.ap?"ca ":"")+t+y;
}
function draw(){
  const ql=q.toLowerCase();
  const rows=ev.filter(x=>(showPast||x.e>=T)&&(!sel||x.k===sel)&&(!ql||(x.n+" "+x.p+" "+S[x.k][1]+" "+(x.tv||"")).toLowerCase().includes(ql)));
  cur=rows;document.getElementById("cnt").textContent=rows.length+" mästerskap"+(sel?" · "+S[sel][1]:"");
  let h="",last="";
  for(const x of rows){
    const m=x.s.toLocaleDateString("sv-SE",{month:"long",year:"numeric"});
    if(m!==last){h+="<h2>"+m+"</h2>";last=m}
    const[c,t]=status(x);
    h+='<div class="card '+c+'" data-i="'+rows.indexOf(x)+'"><div class="em">'+S[x.k][0]+'</div><div class="bd"><div class="nm">'+x.n+'</div><div class="mt">'+dtxt(x)+' · '+x.p+'</div>'+(x.tv?'<div class="tv">'+TVI+x.tv+'</div>':'')+'</div><div class="st">'+t+'</div></div>';
  }
  document.getElementById("list").innerHTML=h||'<div class="empty">Inget hittades.</div>';
}
function chips(){
  const ks=Object.keys(S).filter(k=>ev.some(x=>x.k===k)).sort((a,b)=>S[a][1].localeCompare(S[b][1],"sv"));
  const el=document.getElementById("chips");
  el.innerHTML='<button class="chip on" data-k="">Alla sporter</button>'+ks.map(k=>'<button class="chip" data-k="'+k+'"><span>'+S[k][0]+" "+S[k][1]+'</span><span class="n">'+ev.filter(x=>x.k===k).length+"</span></button>").join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;sel=b.dataset.k;el.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));document.body.classList.remove("menu");window.scrollTo(0,0);draw()};
}
document.getElementById("q").oninput=e=>{q=e.target.value;draw()};
document.getElementById("past").onchange=e=>{showPast=e.target.checked;draw()};
document.getElementById("mbtn").onclick=()=>document.body.classList.toggle("menu");
document.getElementById("ov").onclick=()=>document.body.classList.remove("menu");
document.getElementById("sbtn").onclick=()=>{const o=document.body.classList.toggle("srch");if(o)document.getElementById("q").focus()};
const mo=document.getElementById("mo");
mo.onclick=e=>{if(e.target===mo||e.target.closest(".x"))document.body.classList.remove("mo")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.body.classList.remove("mo")});
document.getElementById("list").onclick=e=>{const c=e.target.closest(".card");if(c)show(+c.dataset.i)};
document.getElementById("list").innerHTML='<div class="empty">Laddar…</div>';
fetch("events.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
  S=j.sports;
  ev=j.events.map(a=>({s:P(a.s),e:P(a.e),n:a.n,k:a.k,p:a.p,ap:a.ap||0,l:a.l||"",tv:a.tv||"",d:a.d||""})).sort((x,y)=>x.s-y.s||x.e-y.e);
  document.getElementById("upd").textContent="Uppdaterad "+P(j.updated).toLocaleDateString("sv-SE",{day:"numeric",month:"short",year:"numeric"})+".";
  chips();draw();
}).catch(()=>{document.getElementById("list").innerHTML='<div class="empty">Kunde inte läsa events.json.</div>'});
</script></body></html>
